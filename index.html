    <!-- Simple localStorage wrapper to match window.storage usage -->
    <script>
      window.storage = {
        async get(key) {
          const value = localStorage.getItem(key);
          return value ? { value } : null;
        },
        async set(key, value) {
          localStorage.setItem(key, value);
        }
      };
    </script>
